name: Publicar verificador de pagos

# Sube el verificador de suscripciones a Cloudflare.
# Necesita 3 secretos en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, MP_ACCESS_TOKEN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/publicar-cobro.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar secretos
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MP: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          if [ -z "$CF" ] || [ -z "$ACC" ] || [ -z "$MP" ]; then
            echo "Faltan secretos; no se publica todavía."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Publicar en Cloudflare
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            MP_ACCESS_TOKEN
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
