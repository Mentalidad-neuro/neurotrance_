<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NeuroTrance</title>
    <meta name="description" content="Meditaciones, sonidos para estudiar y dormir, y pomodoros para llegar en calma a tus evaluaciones." />
    <meta name="theme-color" content="#2a2230" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeuroTrance" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #2a2230;
      }
      body.dia {
        background: #f7f0e6;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar NeuroTrance.</noscript>
    <script>
      // Mismo cambio que la app: Nido de día (7:00 a 19:59), Atardecer de noche.
      (function () { var h = new Date().getHours(); if (h >= 7 && h < 20) document.body.className = 'dia'; })();
    </script>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
