# Publica la versión web (app instalable) en GitHub Pages cada vez que se sube un cambio a main.
name: Publicar app web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # GitHub Pages no sirve carpetas que empiezan con "_" sin este archivo.
      - run: touch dist/.nojekyll && cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
